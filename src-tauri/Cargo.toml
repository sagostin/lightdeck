[package]
name = "lightdeck"
version = "0.1.5"
description = "Audio-reactive Art-Net lighting controller"
edition = "2021"

[lib]
name = "lightdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
rustfft = "6"
roxmltree = "0.20"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2"
rumqttc = "0.25.1"
midir = "0.11.1"

[profile.dev.package."*"]
opt-level = 2
