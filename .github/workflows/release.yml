name: Release

# Push a tag like v0.2.0 (after `npm run version:set 0.2.0`) to build installers and
# attach them to a draft GitHub release. Review the draft, then publish it.
# "Run workflow" on the Actions tab builds the current version without a tag check.
#
# Only installers are uploaded:
#   macOS    .dmg            (Apple Silicon and Intel)
#   Windows  .msi, -setup.exe
#   Linux    .AppImage, .deb, .rpm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app version $app. Run 'npm run version:set ${GITHUB_REF_NAME#v}', commit, and tag again."
            exit 1
          fi
          echo "tag=v$app" >> "$GITHUB_OUTPUT"

      - name: Create the draft (if it doesn't exist yet)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; builds will replace its files."
            exit 0
          fi
          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon: M1 and later) | `LightDeck_*_aarch64.dmg` |
          | macOS (Intel) | `LightDeck_*_x64.dmg` |
          | Windows | `LightDeck_*_x64-setup.exe` or `.msi` |
          | Linux | `.AppImage`, `.deb` or `.rpm` |

          **macOS:** open the `.dmg` and drag LightDeck to Applications. These builds are unsigned, so the
          first time, right-click the app and choose **Open** (or run
          `xattr -dr com.apple.quarantine /Applications/LightDeck.app`).

          **Windows:** SmartScreen may warn about an unknown publisher. Choose **More info → Run anyway**.
          EOF
          gh release create "$TAG" --draft --title "LightDeck $TAG" --notes-file notes.md --target "$GITHUB_SHA"

  build:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            assets: dmg/*.dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            assets: dmg/*.dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            assets: msi/*.msi nsis/*-setup.exe
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            assets: appimage/*.AppImage deb/*.deb rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            zigbee-helper/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: zigbee-helper

      # tauri.bundle.json adds the Zigbee helper and a bundled Node.js runtime
      # (downloaded for the target by scripts/prepare-bundle.mjs).
      - name: Build
        shell: bash
        env:
          # Lay out the DMG window (app icon + Applications shortcut) even on CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          # Code signing (optional). Add these repository secrets, then uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --ci --target ${{ matrix.target }} --config src-tauri/tauri.bundle.json

      - name: Upload installers to the draft release
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          shopt -s nullglob
          cd "src-tauri/target/${{ matrix.target }}/release/bundle"
          files=(${{ matrix.assets }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found for: ${{ matrix.assets }}"
            ls -R . | head -50
            exit 1
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightDeck-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
          retention-days: 14
